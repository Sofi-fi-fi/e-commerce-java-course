openapi: 3.0.3
info:
  title: Intergalactic Market - Product API
  version: 1.0.0
  description: API контракт для керування товарами маркетплейсу Intergalactic Market.
paths:
  /api/products:
    get:
      summary: Отримати список продуктів з пагінацією
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Успішна відповідь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Створити новий продукт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequestDto'
      responses:
        '201':
          description: Продукт успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/{id}:
    get:
      summary: Отримати продукт за ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Оновити продукт
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequestDto'
      responses:
        '200':
          description: Успішно оновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Видалити продукт
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успішно видалено
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Invalid request (validation error, malformed JSON or wrong parameter type)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProductNotFound:
      description: Product with the given id does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Unexpected server error (no internal details are exposed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProductRequestDto:
      type: object
      required:
        - name: price
      properties:
        name:
          type: string
          description: Назва має містити космічне слово (star, galaxy, comet тощо)
          example: Supernova Star Food
        price:
          type: number
          minimum: 0.01
          example: 25.50
        categoryName:
          type: string
          example: Cat Food
    ProductResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
        price:
          type: number
        categoryName:
          type: string
    ProductPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponseDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    ProblemDetail:
      type: object
      description: Error response in RFC 9457 format
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Error type URI; omitted when it is `about:blank` (nothing to add beyond the HTTP status)
          example: https://intergalactic-market.com/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Request contains invalid fields
        instance:
          type: string
          format: uri
          example: /api/products
        errors:
          type: array
          description: Present only for validation errors
          items:
            $ref: '#/components/schemas/FieldValidationError'
    FieldValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: must be greater than or equal to 0.01
